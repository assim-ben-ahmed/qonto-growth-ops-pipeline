# Rebuild the live demo on every push to main:
# run the whole pipeline, export the console as static files, publish on GitHub Pages.
name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # API responses + LLM notes are cached between runs: faster, and polite to the public API.
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pipeline-cache-${{ github.run_id }}
          restore-keys: pipeline-cache-

      - name: Run the pipeline
        env:
          # Optional repository secret. Without it, notes come from the template.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python run_pipeline.py

      - name: Build the static site
        run: python -m web.build_static site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
